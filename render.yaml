services:
  - type: web
    name: wcg-team-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SCRAPE_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        sync: false
